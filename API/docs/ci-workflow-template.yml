name: Delta 2 Demo CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  python-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -r requirements.txt pytest httpx
      - name: Run API regression tests (SQLite demo)
        run: python -m pytest -q tests/test_api.py
      - name: JS syntax check
        run: node --check frontend/assets/app.js
