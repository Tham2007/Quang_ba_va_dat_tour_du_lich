name: Public release smoke and persistence gate

on:
  push:
    branches: [main]
    paths:
      - 'Frontend/**'
      - 'API/**'
      - '.github/workflows/ci-public-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-http:
    name: Public website read-only smoke
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile public-release script
        run: python -m py_compile API/scripts/check_public_release.py
      - name: Probe An's live FastAPI site and static landing URL
        run: python API/scripts/check_public_release.py

  durable-data:
    name: Durable production database gate
    needs: public-http
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require persistent PostgreSQL instead of temporary SQLite
        run: python API/scripts/check_public_release.py --require-durable
