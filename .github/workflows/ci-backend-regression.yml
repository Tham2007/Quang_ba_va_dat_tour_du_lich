name: Legacy FastAPI regression (SQLite academic demo)

on:
  push:
    paths:
      - 'API/api/**'
      - 'API/tests/**'
      - 'API/frontend/**'
      - 'API/scripts/check_static_assets.py'
      - '.github/workflows/ci-backend-regression.yml'
  pull_request:
    paths:
      - 'API/api/**'
      - 'API/tests/**'
      - 'API/frontend/**'
      - 'API/scripts/check_static_assets.py'
      - '.github/workflows/ci-backend-regression.yml'
  workflow_dispatch:

jobs:
  test-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: API/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r API/requirements.txt pytest httpx ruff==0.14.0
      - name: Test original FastAPI (SQLite demo ONLY)
        working-directory: API
        env:
          DELTA_ENV: development
          DATABASE_URL: sqlite:///./ci_demo.db
          AUTO_CREATE_SCHEMA: '1'
          DEMO_SEED: '1'
        run: python -m pytest -q tests/test_api.py tests/test_legacy_schema_guard.py tests/test_static_assets.py tests/test_architecture.py tests/test_tham_sqlserver_app.py tests/test_tham_sqlserver_checker.py
      - name: Style of modularized Python (Ruff formatter)
        run: python -m ruff format --check API/api/app.py API/api/core.py API/api/logic.py API/api/schemas.py API/api/routes/
      - name: Catch undefined names
        run: python -m ruff check --select F821 API/api/app.py API/api/core.py API/api/logic.py API/api/schemas.py API/api/routes/
      - name: Audit static assets
        working-directory: API
        run: python -m scripts.check_static_assets
