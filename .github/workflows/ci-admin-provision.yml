name: Secure administrator provisioning guard
on:
  push:
    paths:
      - 'API/scripts/provision_admin.py'
      - '.github/workflows/ci-admin-provision.yml'
  pull_request:
    paths:
      - 'API/scripts/provision_admin.py'
      - '.github/workflows/ci-admin-provision.yml'
permissions:
  contents: read
jobs:
  fail-closed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile-check operator-only script
        run: python -m py_compile API/scripts/provision_admin.py
      - name: Refuse provisioning without DB-owner acknowledgment
        shell: bash
        run: |
          if python API/scripts/provision_admin.py --email admin@example.test --name "Test Operator" --phone 0912345678; then
            echo "ERROR: provisioning was not locked down"
            exit 1
          fi
          echo "PASS: no provisioning without explicit private DB owner authorization"
