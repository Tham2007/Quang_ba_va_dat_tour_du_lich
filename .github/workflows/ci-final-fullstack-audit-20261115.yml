name: Final full-stack audit 2026-11-15 (no bank transactions)

on:
  push:
    branches: ["audit/final-fullstack-20261115"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fastapi-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r API/requirements.txt pytest httpx ruff==0.14.0
      - name: Full FastAPI regression against isolated demo SQLite
        working-directory: API
        env:
          DELTA_ENV: development
          DATABASE_URL: sqlite:///./audit_demo.db
          DEMO_SEED: "1"
          AUTO_CREATE_SCHEMA: "1"
        run: python -m pytest -q tests/test_api.py tests/test_legacy_schema_guard.py tests/test_static_assets.py tests/test_architecture.py tests/test_mvc_structure.py tests/test_tham_sqlserver_app.py tests/test_tham_sqlserver_checker.py
      - name: Python compile and undefined names
        run: |
          python -m compileall -q API/api
          python -m ruff check --select F821 API/api/
      - name: Python formatter contract
        run: python -m ruff format --check API/api/app.py API/api/logic.py API/api/core/ API/api/schemas/ API/api/routes/ API/api/controllers/ API/api/services/ API/api/repositories/

  node-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Node application syntax check
        run: node --check server.js
      - name: Full Node SQLite API & security integration tests
        run: npm test

  frontend-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: All frontend JavaScript syntax checks
        run: find Frontend/assets/js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: HTML/CSS references and demo safety
        run: |
          python API/scripts/check_static_assets.py Frontend
          python Frontend/tools/check_demo_integrity.py
      - name: Real Chromium static UI walkthrough
        run: |
          npm install --no-save playwright-core@1.56.1
          node Frontend/tests/browser-smoke.cjs

  chromium-real-api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DELTA_ENV: development
      DATABASE_URL: sqlite:////tmp/delta_final_fullstack_audit.db
      AUTO_CREATE_SCHEMA: "1"
      DEMO_SEED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FastAPI and Playwright driver
        run: |
          python -m pip install -r API/requirements.txt httpx
          npm install --no-save playwright-core@1.56.1
      - name: Start real FastAPI HTTP
        run: |
          cd API
          python -m uvicorn api.app:app --host 127.0.0.1 --port 8999 >/tmp/delta-final-audit-api.log 2>&1 &
          for i in $(seq 1 100); do
            if curl -sf http://127.0.0.1:8999/api/v1/health/ready >/dev/null; then exit 0; fi
            sleep 0.3
          done
          cat /tmp/delta-final-audit-api.log
          exit 1
      - name: Real browser auth, booking, cancellation and admin isolation
        run: |
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          node Frontend/tests/an-live-browser.cjs
      - name: Real booking.html checkout, CSRF and no self-payment
        run: |
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          node Frontend/tests/final-real-checkout.cjs

  postgres16-alembic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: delta_ci
          POSTGRES_PASSWORD: DeltaCi_Only_2026
          POSTGRES_DB: delta_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U delta_ci -d delta_ci"
          --health-interval 3s --health-timeout 3s --health-retries 15
    env:
      DELTA_ENV: staging
      STAGING_AUTO_MIGRATE: "1"
      DEMO_SEED: "1"
      AUTO_CREATE_SCHEMA: "0"
      DATABASE_URL: postgresql+psycopg://delta_ci:DeltaCi_Only_2026@127.0.0.1:5432/delta_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r API/requirements.txt pytest httpx
      - name: Real PostgreSQL 16 migrations, booking and transactions
        working-directory: API
        run: python -m scripts.ci_postgres_live

  sqlserver2022-ephemeral:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "D3lta_Trav3l_CI_Only_2026!"
          MSSQL_PID: "Developer"
        ports:
          - 1433:1433
    env:
      DELTA_SQLSERVER_EPHEMERAL: "1"
      CI_SQLSERVER_HOST: "127.0.0.1"
      CI_SQLSERVER_SA_PASSWORD: "D3lta_Trav3l_CI_Only_2026!"
      DELTA_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r API/requirements.txt pytest httpx pymssql
      - name: Real SQL Server 2022 12-table schema and API integration
        working-directory: API
        run: python -m scripts.ci_sqlserver_e2e

  security-release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Release-critical security assertions
        run: node Frontend/tests/final-p0-security.cjs
      - name: Current invoice feature must not mislabel a browser-generated receipt
        if: always()
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const x = fs.readFileSync('Frontend/assets/js/services/ticket-invoice-service.js','utf8');
          if (/Hóa đơn điện tử có giá trị pháp lý|Hóa Đơn Điện Tử Giá Trị Gia Tăng \(Chuẩn Nghị Định/.test(x)) {
            console.error('BLOCKED: browser-generated VAT document claims official/legal status without verified issuance');
            process.exit(1);
          }
          console.log('PASS: no unsupported official invoice assertion');
          NODE

  public-https-staging-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      DELTA_STAGING_SMOKE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install httpx==0.28.1
      - name: Real public HTTPS smoke with synthetic book/cancel, no bank payment
        run: python API/scripts/smoke_render_staging.py
