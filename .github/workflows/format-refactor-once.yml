name: One-time format on refactor branch (temporary)

on:
  push:
    paths:
      - '.github/workflows/format-refactor-once.yml'

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'Tham2007/Quang_ba_va_dat_tour_du_lich' && github.ref == 'refs/heads/refactor/clean-fastapi-modules-and-repo-map-20261028'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Format refactored modules only
        run: |
          python -m pip install ruff==0.14.0
          python -m ruff format API/api/app.py API/api/core.py API/api/logic.py API/api/schemas.py API/api/routes/
          git diff --stat
      - name: Commit formatting only to feature branch
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add API/api/app.py API/api/core.py API/api/logic.py API/api/schemas.py API/api/routes/
            git commit -m "style(api): format modular FastAPI code for readability"
            git push origin HEAD:refs/heads/refactor/clean-fastapi-modules-and-repo-map-20261028
          fi
