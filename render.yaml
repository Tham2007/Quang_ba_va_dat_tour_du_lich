services:
  - type: web
    name: delta-travel
    env: node
    plan: free
    region: singapore
    autoDeploy: true
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: ENABLE_TUNNEL
        value: "false"
      - key: SEPAY_ACCOUNT_NUMBER
        value: "0325536936"
      - key: SEPAY_BANK_NAME
        value: "MBBank"
      - key: SEPAY_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: SQL_SERVER_HOST
        value: "sql8020.site4now.net"
      - key: SQL_SERVER_PORT
        value: "1433"
      - key: SQL_SERVER_DB
        value: "db_ad0b71_dattour"
      - key: SQL_SERVER_USER
        value: "db_ad0b71_dattour_admin"
      - key: SQL_SERVER_PASS
        sync: false
      - key: DELTA_MSSQL_SERVER
        value: "sql8020.site4now.net"
      - key: DELTA_MSSQL_PORT
        value: "1433"
      - key: DELTA_MSSQL_DATABASE
        value: "db_ad0b71_dattour"
      - key: DELTA_MSSQL_USER
        value: "db_ad0b71_dattour_admin"
      - key: DELTA_MSSQL_PASSWORD
        sync: false
